name: Release Dutix GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Release
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Dependencies
        run: make deps

      - name: Run Backend Tests
        run: make test

      - name: Extract Release Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build Universal macOS .app Bundle
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          wails build -platform darwin/universal -clean -ldflags "-X dutix-gui/pkg/version.Version=${VERSION} -X dutix-gui/pkg/version.GitCommit=${{ github.sha }} -X dutix-gui/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Package Release Assets (.zip & checksums)
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist/
          
          # Compress Universal App Bundle
          cd "build/bin"
          ditto -c -k --sequesterRsrc --keepParent "Dutix GUI.app" "../../dist/Dutix-GUI-${VERSION}-macOS-Universal.zip"
          cd ../..

          # Generate SHA256 Checksums
          cd dist
          shasum -a 256 *.zip > "Dutix-GUI-${VERSION}-checksums.txt"
          cd ..
          
          ls -la dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Dutix GUI ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
